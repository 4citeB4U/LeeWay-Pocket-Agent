  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
    }
    /* Floating translucent Agent Lee side tab */
    .agent-side-tab {
      position: fixed;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 64px;
      min-height: 112px;
      border-radius: 28px;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      z-index: 19;
      pointer-events: none;
    }

    /* Top Floating Hamburger Button */
    .hamburger-btn {
      position: absolute;
      top: 50%;
      right: 23px;
      left: auto;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: transparent;
      border: 0;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      z-index: 20;
      transition: all 0.25s ease;
      outline: none;
    }
    .hamburger-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(56, 189, 248, 0.8);
      transform: translateY(-50%) scale(1.05);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.3);
    }
    .hamburger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
      transition: all 0.2s ease;
    }

    /* Subtle Bottom Status Indicator */
    .status-badge {
      display: none !important;
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(10, 14, 23, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: none;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      transition: all 0.3s ease;
    }
    .status-badge.active .status-dot {
      background: #f43f5e;
      box-shadow: 0 0 12px #f43f5e;
    }
    .status-text {
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Slide-out Navigation Drawer */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(4px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      max-width: 85%;
      height: 100%;
      background: rgba(5, 12, 24, 0.28);
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      z-index: 35;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .drawer-subtitle {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 2px;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }
    .element-card {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .element-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .element-name {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
    }
    .element-motto {
      color: #94a3b8;
      font-size: 10px;
      margin-top: 2px;
    }
    .element-action {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>

  <script>
    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = null;

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    container.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x06182c, 1.8);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0x67e8f9, 3.4);
    keyLight.position.set(-3.5, 4.0, 3.5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x0284c7, 2.5);
    rimLight.position.set(3.5, -2.5, -2.5);
    scene.add(rimLight);

    const fissureLight = new THREE.PointLight(0x38bdf8, 3.6, 6);
    fissureLight.position.set(0, 0, 0);
    scene.add(fissureLight);

    // --- MAIN GLOBE GROUP ---
    const sphereGroup = new THREE.Group();
    sphereGroup.position.set(0, 0, 0); // Perfectly centered
    scene.add(sphereGroup);

    // --- 1. REALISTIC DUAL-HEMISPHERE BRAIN GEOMETRY ---
    const brainGroup = new THREE.Group();
    sphereGroup.add(brainGroup);

    const gapX = 0.085;
    const latSteps = 22;
    const lonSteps = 16;

    function createHemisphereGeometry(isLeft) {
      const geom = new THREE.BufferGeometry();
      const vertices = [];
      const normals = [];
      const indices = [];

      const side = isLeft ? -1 : 1;
      const grid = [];

      for (let i = 0; i <= latSteps; i++) {
        grid[i] = [];
        const latFrac = i / latSteps;
        const lat = (latFrac - 0.5) * Math.PI * 0.94;

        for (let j = 0; j <= lonSteps; j++) {
          const lonFrac = j / lonSteps;
          const lon = lonFrac * Math.PI;

          const isMedial = j === 0;

          const cosLat = Math.cos(lat);
          const sinLat = Math.sin(lat);
          const baseY = -sinLat * 0.90 - 0.05;
          const baseZ = Math.cos(lon) * cosLat * 1.12;
          const sinLon = Math.sin(lon);

          let gyri = 0;
          if (!isMedial) {
            const n1 = Math.sin(lat * 8.5) * Math.cos(lon * 7.0) * 0.095;
            const n2 = Math.cos(lat * 15.0 + lon * 11.0) * 0.045;
            const n3 = Math.sin(baseZ * 9.0) * 0.035;
            gyri = n1 + n2 + n3;
          }

          const r = 1.0 + gyri;
          const posX = isMedial ? (side * gapX) : (side * (gapX + sinLon * cosLat * 0.82 * r));
          const posY = baseY * r;
          const posZ = baseZ * r;

          const vIndex = vertices.length / 3;
          grid[i][j] = vIndex;
          vertices.push(posX, posY, posZ);

          if (isMedial) {
            normals.push(-side, 0, 0);
          } else {
            const vNorm = new THREE.Vector3(posX - side * gapX, posY, posZ).normalize();
            normals.push(vNorm.x, vNorm.y, vNorm.z);
          }
        }
      }

      for (let i = 0; i < latSteps; i++) {
        for (let j = 0; j < lonSteps; j++) {
          const v0 = grid[i][j];
          const v1 = grid[i + 1][j];

    const bridgeSignalCount = 32;

      'PEₜ = εₜᵀ Πₜ εₜ',

    function emitLeeWayFormulaThoughts(){
      const host=document.getElementById('leeway-formula-thoughts');
      if(!host || document.hidden || document.getElementById('drawer')?.classList.contains('open')) return scheduleLeeWayFormulaThoughts();

      for(let i=0;i<count;i++){
        let index=Math.floor(Math.random()*leewayFormulaThoughts.length);while(used.has(index)&&used.size<leewayFormulaThoughts.length)index=Math.floor(Math.random()*leewayFormulaThoughts.length);used.add(index);
        const el=document.createElement('span');el.className='formula-thought';el.textContent=leewayFormulaThoughts[index];
        let left=8+Math.random()*76, top=12+Math.random()*70;if(left<30&&top<28){left+=28;top+=8;}
        el.style.left=left+'%';el.style.top=top+'%';el.style.animationDelay=(i*.36)+'s';host.appendChild(el);setTimeout(()=>el.remove(),6800+i*360);
      }

    }
    function scheduleLeeWayFormulaThoughts(){clearTimeout(leewayFormulaTimer);leewayFormulaTimer=setTimeout(emitLeeWayFormulaThoughts,20000+Math.random()*10000)}
    scheduleLeeWayFormulaThoughts();


    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const time = clock.getElapsedTime();

      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        const avg = sum / dataArray.length;

      const talkYawSway = isSpeaking ? Math.cos(time * 3.6) * 0.03 : 0;

      // Gentle coin-like idle sway, presentation only. Pause immediately during an owner drag.

      sphereGroup.rotation.y = yaw + talkYawSway + idleCoinSway;
      sphereGroup.rotation.x = pitch + talkPitchSway;
      sphereGroup.rotation.z = idleCoinSway * 0.45;

      rimMesh.lookAt(camera.position);

      // Living idle respiration plus speech-driven emphasis. Presentation only; never a health/consciousness claim.
      const idleBreath = 0.022 * Math.sin(time * 1.18) + 0.007 * Math.sin(time * 0.43);
      const talkPulse = isSpeaking ? (0.038 * Math.sin(time * 8.4) + voiceAmplitude * 0.11) : (voiceAmplitude * 0.06);
      const currentScale = 1.0 + idleBreath + talkPulse;
      brainGroup.scale.set(currentScale * (1.0 + 0.006 * Math.sin(time * 0.79)), currentScale * (1.0 + 0.012 * Math.sin(time * 1.07 + 0.8)), currentScale * (1.0 + 0.004 * Math.sin(time * 0.67)));
      glassMesh.scale.setScalar(1.0 + 0.0035 * Math.sin(time * 0.91));
      brainMaterial.emissiveIntensity = 0.82 + 0.12 * Math.sin(time * 1.31) + voiceAmplitude * 0.65;
      wireframeMaterial.opacity = 0.48 + 0.10 * Math.sin(time * 0.87) + voiceAmplitude * 0.16;

      // Central Fissure Bridge Light Surge
      const fissureIntensity = isSpeaking ? (3.5 + voiceAmplitude * 6.0 + Math.sin(time * 10) * 1.5) : (2.5 + voiceAmplitude * 4.0);
      fissureLight.intensity = fissureIntensity;

      // Accelerated Synaptic Particles across the gap
      const sigPositions = bridgeSigGeom.attributes.position.array;
      const particleSpeed = (isSpeaking ? 4.0 : 1.0) * (1.0 + voiceAmplitude * 3.5);
      for (let s = 0; s < bridgeSignalCount * 3; s += 3) {
        sigPositions[s + 0] += (Math.random() - 0.5) * 0.04 * particleSpeed;
        if (Math.abs(sigPositions[s + 0]) > gapX * 1.25) {
          sigPositions[s + 0] = (Math.random() - 0.5) * gapX;
        }
      }
      bridgeSigGeom.attributes.position.needsUpdate = true;

      constellGroup.rotation.y = time * 0.02;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

window.__leewayOwnerRecords=async function(key,article){
 const add=(tag,value,parent=article)=>{const n=document.createElement(tag);n.textContent=value;parent.appendChild(n);return n};
 const action=(name,fn)=>{const b=add('button',name);b.type='button';b.onclick=fn;return b};
 if(key==='authority'&&window.pywebview?.api?.open_windows_permissions){const b=add('button','Open Windows Permissions');b.type='button';b.onclick=async()=>{try{await window.pywebview.api.open_windows_permissions();}catch(e){add('p','Settings launch failed: '+e.message);}};}
 if(key==='authority'){
  add('p','Device-specific owner permissions. Opening this page does not grant access.');
  if(window.LeeWayAndroid?.authoritySummary){
   const data=JSON.parse(window.LeeWayAndroid.authoritySummary());
   for(const p of data.permissions||[]){add('p',p.label+': '+(p.granted?'GRANTED':'NOT GRANTED'));}
   action('Android app permissions',()=>window.LeeWayAndroid.openPermissionSettings?.());
   action('Floating overlay permission',()=>window.LeeWayAndroid.enableOverlay?.());
  }else{
   try{const x=await fetch('/health').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});
    for(const [name,p] of Object.entries(x.sources||{})){add('p',name+': '+(p.connected?'OBSERVED CONNECTED':'NOT CONNECTED'));}
    add('p','Execution authority remains gated by the canonical Runtime Fabric and Veritas.');
   }catch(e){add('p','Local authority source unavailable: '+e.message);}
  }
  return;
 }
 if(key==='evidence'){
  add('p','Owner-scoped existing records, grouped by source. No fabricated receipts or invented remote device records.');
  let data;
  try{data=window.LeeWayAndroid?.evidenceSummary
   ?JSON.parse(window.LeeWayAndroid.evidenceSummary())
   :await fetch('/owner-evidence').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});}
  catch(e){add('p','Evidence index unavailable: '+e.message);return;}
  add('p','Scope: '+data.scope+' â€¢ Read only');
  const groups=data.groups||[];
  add('p',groups.length+' categorized folders; '+(data.observedFiles||'local')+' observed files');
  const query=document.createElement('input');
  query.type='search';query.placeholder='Search receipt category or filename';query.setAttribute('aria-label','Search your evidence');
  query.style.cssText='width:100%;background:#10263a;color:#fff;padding:12px;border:1px solid #6592ad;border-radius:8px';
  article.appendChild(query);
  const resultNote=add('p','');
  const list=document.createElement('div');article.appendChild(list);
  function display(){
   list.replaceChildren();
   const q=query.value.toLowerCase().trim();
   const matches=groups.filter(g=>!q||g.category.toLowerCase().includes(q)||(g.recent||[]).some(f=>f.name.toLowerCase().includes(q)));
   resultNote.textContent=matches.length+' matching categories; showing up to 80';
   for(const g of matches.slice(0,80)){
    const details=document.createElement('details');list.appendChild(details);
    const summary=document.createElement('summary');summary.textContent=g.category+' ('+(g.observedFiles??(g.recent||[]).length)+' files)';details.appendChild(summary);
    if(!(g.recent||[]).length)add('p','No indexed recent files.',details);
    for(const f of g.recent||[]){
     const n=add(f.url?'a':'p',f.name+' | '+(f.bytes??'?')+' bytes',details);
     if(f.url){n.href=f.url;n.target='_blank';n.rel='noopener noreferrer';n.style.display='block';n.style.padding='8px';}
    }
   }
  }
  query.addEventListener('input',display);display();
  for(const note of data.limitations||[]){add('p','Coverage: '+note);}
 }
};

 if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
 const data=event.data;if(!data||data.leewayRoundBox!==true)return;

 if(data.action==='move'&&Number.isFinite(data.dx)&&Number.isFinite(data.dy)&&Math.abs(data.dx)<=300&&Math.abs(data.dy)<=300){
  const box=host.getBoundingClientRect();

  host.style.top=Math.max(0,Math.min(innerHeight-box.height,box.top+data.dy))+'px';

 }
});

(()=>{'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const html=(tag,cls,content)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(content!==undefined)el.innerHTML=content;return el};
function common(key){
 const w=html('div','lw-screen');const shell=html('div','lw-shell');
 const top=html('div','lw-top');const close=html('button','lw-close','× &nbsp; Close Window');close.type='button';close.onclick=()=>{if(window.LeeWayAndroid?.closeSurface){window.LeeWayAndroid.closeSurface();return;}document.getElementById('surface-panel').classList.remove('open','leeway-three-open');window.__leewayFloating?.host('panel',false)};top.append(close,html('div','lw-brand','LEEWAY  /  AGENT LEE'));shell.append(top);w.append(shell);return{w,shell};
}
function footer(shell){shell.append(html('footer','lw-foot','<span>LEEWAY · AGENT LEE</span><span>TRUSTED · TRANSPARENT · VERIFIED</span>'))}
function about(shell){
 shell.append(html('h1','lw-heading','About LeeWay'),html('div','lw-subtitle','Logically Enhanced Engineering for Workload, Authority &amp; Yield.'),html('p','', 'LeeWay is designed to increase human capability without replacing human responsibility. Agent Lee is the user-facing assistant and coordinator across your authorized devices, with explicit permissions and inspectable results.'));
 const rows=[
 ['▣','Your device, your information','Each device has its own Digital Brain to organize authorized file observations, relationships, provenance and physical-device information. Missing permissions and unavailable sensors must remain visible. Continuum is LeeWay’s governed database fabric, with approved federation and local device state.'],
 ['◎','Models are optional','LeeWay does not require an LLM for its implemented deterministic duties. Models remain tools, not owners of identity, permissions or voice. Unsupported requests must be disclosed.'],
 ['▥','One Agent Lee voice','Voice belongs to the shared LeeWay Voice system. Cross-device selection and audibility require their own verification.'],
 ['⚙','Work and services','Agent VT provides a bounded Virtual Tablet. Skills and authorized Device/Commander capabilities supply execution; evidence and receipts record what actually happened.']
 ];
 rows.forEach(([icon,title,body],i)=>shell.append(html('section','lw-panel lw-about-card', '<div class="lw-symbol">'+icon+'</div><div><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p></div>')));
 shell.append(html('section','lw-panel lw-warning','<strong>This installation is under qualification.</strong><p>A component’s presence does not prove every service is connected. Owner control, transparent failure reporting and tested recovery remain required.</p>'));footer(shell);
}
function readSource(key){try{const fn=key==='evidence'?'evidenceSummary':'authoritySummary';const raw=window.LeeWayAndroid?.[fn]?.();return raw?JSON.parse(raw):null}catch(e){return{error:String(e)}}}
async function source(key){const local=readSource(key);if(local)return local;if(key==='evidence'){try{const r=await fetch('/owner-evidence');if(r.ok)return r.json()}catch{}}return null}
function statGrid(shell,values){const grid=html('div','lw-grid');values.forEach(([value,label])=>grid.append(html('div','lw-panel','<div class="lw-stat">'+esc(value)+'</div><div class="lw-muted">'+esc(label)+'</div>')));shell.append(grid)}
async function evidence(shell){
 const data=await source('evidence');const groups=Array.isArray(data?.groups)?data.groups:[];
 shell.append(html('h1','lw-heading','▱ Evidence &amp; Receipts'),html('p','', 'Owner-scoped existing records, grouped by source. No fabricated receipts or invented remote device records.'));
 shell.append(html('div','lw-subtitle','Scope: '+esc(data?.scope||'SOURCE NOT CONNECTED')+' — Read only'));
 statGrid(shell,[[groups.length,'Matching Categories'],[data?.observedFiles??'—','Observed Files'],[Math.min(groups.length,80),'Showing (Current)'],['Read Only','Verified scope not asserted']]);
 const search=html('input','lw-search');search.placeholder='Search receipt category or filename…';search.type='search';search.setAttribute('aria-label','Search evidence');shell.append(search);
 const two=html('div','lw-two');const side=html('nav','lw-side');const records=html('div','lw-records');two.append(side,records);shell.append(two);
 const kinds=['All Categories',...new Set(groups.map(g=>String(g.category||'').split('/')[0]).filter(Boolean))].slice(0,12);let selected='All Categories';
 function refresh(){side.replaceChildren();kinds.forEach(k=>{const b=html('button','',esc(k));b.type='button';b.setAttribute('aria-pressed',String(k===selected));b.onclick=()=>{selected=k;refresh()};side.append(b)});records.replaceChildren();const q=search.value.toLowerCase();const found=groups.filter(g=>(selected==='All Categories'||String(g.category||'').startsWith(selected))&&(String(g.category||'').toLowerCase().includes(q)||(g.recent||[]).some(f=>String(f.name||'').toLowerCase().includes(q))));records.append(html('div','lw-record-row','<strong>'+found.length+' matching categories</strong><span>FILES</span>'));found.slice(0,80).forEach(g=>{const row=html('div','lw-record-row');row.append(html('span','', '▱ '+esc(g.category||'Unnamed category')),html('span','',esc(g.observedFiles??(g.recent||[]).length)));records.append(row)});if(!data||data.error)records.append(html('p','lw-panel','Evidence data unavailable; no substitute records generated.'))}
 search.addEventListener('input',refresh);refresh();footer(shell);
}
async function authority(shell){
 const data=await source('authority');const perms=Array.isArray(data?.permissions)?data.permissions:[];
 shell.append(html('h1','lw-heading','⬡ Authority &amp; Permissions'),html('p','', 'Manage Agent Lee’s authority, device access and permission boundaries.'),html('div','lw-subtitle','Scope: device-owner permissions — observation only'));
 statGrid(shell,[[perms.length||'—','Observed permission categories'],['—','Connected devices not confirmed'],['—','Authority domains not confirmed'],['—','Pending requests not confirmed']]);
 shell.append(html('section','lw-panel lw-scope','<strong>Agent Lee operates only within approved permissions.</strong><p>No access is granted by opening this screen.</p>'));
 const grid=html('div','lw-auth-group');const box=html('section','lw-panel');box.append(html('h3','','Permission Categories'));if(perms.length){perms.forEach(p=>box.append(html('div','lw-record-row','<span>'+esc(p.label)+'</span><strong>'+esc(p.granted?'Granted':'Not granted')+'</strong>')))}else box.append(html('p','','Device permission inventory is not connected or unavailable.'));
 const scope=html('section','lw-panel');scope.append(html('h3','','Authority Scope'),html('p','','Owner-scoped. No permission is inferred from visual design.'));const b=html('button','lw-action','Android app permissions');b.onclick=()=>window.LeeWayAndroid?.openPermissionSettings?.();scope.append(b);
 grid.append(box,scope);shell.append(grid);footer(shell);
}
window.__leewayThreeScreens=async(key,article)=>{if(!['about','evidence','authority'].includes(key))return false;article.replaceChildren();const panel=document.getElementById('surface-panel');panel.classList.add('leeway-three-open');const {w,shell}=common(key);article.append(w);if(key==='about')about(shell);else if(key==='evidence')await evidence(shell);else await authority(shell);return true;};
})();

</script>
<script id="leeway-pc-owner-popup-boot">
window.addEventListener('load',()=>{
 const key=new URLSearchParams(location.search).get('ownerSurface');
 if(!['authority','evidence','about'].includes(key))return;
 document.body.classList.add('leeway-owner-popup');
 const ownerPanel=document.getElementById('surface-panel');
 if(ownerPanel && window.__leewayThreeScreens){
   Promise.resolve(window.__leewayThreeScreens(key,ownerPanel)).then(()=>{
     const button=ownerPanel.querySelector('.lw-close');
     if(button){button.onclick=()=>window.pywebview?.api?.close?.();button.textContent='×  Close Window';}
   }).catch(error=>console.error('PC_THREE_SCREEN_RENDER_FAILED',error));
 }
 const panel=document.getElementById('surface-panel');
 if(panel){const observer=new MutationObserver(()=>{const close=panel.querySelector('button');if(close&&close.textContent==='Back to Agent Lee'){close.textContent='Close Window';close.onclick=()=>window.pywebview?.api?.close?.();observer.disconnect();}});observer.observe(panel,{childList:true,subtree:true});}
});
</script>

<script id="leeway-red-control-label-audit">
(()=>{function paint(){
 for(const b of document.querySelectorAll('button,[role="button"]')){
  const name=(b.getAttribute('aria-label')||b.getAttribute('title')||b.textContent||'').trim();
  if(/^(?:back(?:\s+to\s+.+)?|go back|previous|exit|close(?:\s+window|\s+menu|\s+chat)?|[×✕✖x])$/i.test(name)){
   b.style.setProperty('background-color','#b91c1c','important');
   b.style.setProperty('border-color','#ef4444','important');
   b.style.setProperty('color','#fff','important');
  }
 }
}
document.addEventListener('DOMContentLoaded',paint);
new MutationObserver(paint).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
