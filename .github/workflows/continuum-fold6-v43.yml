name: Fold6 Continuum Curved v43 Source

on:
  push:
    branches:
      - repair/continuum-curved-fold6-v43-20261007
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'scripts/verify-continuum-v43.mjs'
      - '.github/workflows/continuum-fold6-v43.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-continuum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate source-locked Continuum assets and native security contract
        run: node --test scripts/verify-continuum-v43.mjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build scoped Fold6 source APK
        run: gradle :app:assembleDebug --no-daemon --console=plain
