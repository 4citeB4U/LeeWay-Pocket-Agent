name: Build LeeWay Pocket APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/pocket-workstation-side-tab-20260929, leeway-live-update-repair-20261002]
    paths:
      - 'app/**'
      - 'docs/ecosystem-bindings.json'
      - 'tests/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Pocket source contract
        run: node tests/pocket-workstation-source.test.mjs

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Measure, hash, and identify APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "package_bytes=$BYTES" | tee pocket-package-evidence.txt
          echo "sha256=$SHA" | tee -a pocket-package-evidence.txt
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee -a pocket-package-evidence.txt

      - name: Stage verified Pocket release
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p docs/download
          cp "$APK" docs/download/LeeWay-Pocket-Agent.apk
          BYTES=$(stat -c%s docs/download/LeeWay-Pocket-Agent.apk)
          SHA=$(sha256sum docs/download/LeeWay-Pocket-Agent.apk | awk '{print $1}')
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          cat > docs/download/LeeWay-Pocket-Agent-latest.json <<JSON
          {
            "componentId": "pocket-agent",
            "packageName": "industries.leeway.pocket",
            "versionName": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "sha256": "$SHA",
            "sizeBytes": $BYTES,
            "downloadUrl": "./LeeWay-Pocket-Agent.apk",
            "sourceRunId": "${{ github.run_id }}",
            "sourceCommit": "${{ github.sha }}"
          }
          JSON

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-APK
          path: |
            docs/download/LeeWay-Pocket-Agent.apk
            docs/download/LeeWay-Pocket-Agent-latest.json
            pocket-package-evidence.txt
          if-no-files-found: error

      - name: Publish candidate release into repair branch
        if: github.ref == 'refs/heads/leeway-live-update-repair-20261002'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/LeeWay-Pocket-Agent.apk docs/download/LeeWay-Pocket-Agent-latest.json
          git diff --cached --quiet || git commit -m "Publish verified Pocket repair candidate"
          git push origin HEAD:leeway-live-update-repair-20261002

      - name: Publish verified release into repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/LeeWay-Pocket-Agent.apk docs/download/LeeWay-Pocket-Agent-latest.json
          git diff --cached --quiet || git commit -m "Publish latest verified LeeWay Pocket APK"
          git push

