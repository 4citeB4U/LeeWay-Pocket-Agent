name: Build LeeWay Pocket APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage download APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p docs/download
          cp app/build/outputs/apk/debug/app-debug.apk docs/download/LeeWay-Pocket-Agent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-APK
          path: docs/download/LeeWay-Pocket-Agent.apk
          if-no-files-found: error

      - name: Publish APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/LeeWay-Pocket-Agent.apk
          git diff --cached --quiet || git commit -m "Publish latest LeeWay Pocket APK"
          git push
