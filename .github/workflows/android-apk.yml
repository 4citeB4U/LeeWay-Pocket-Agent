name: Build LeeWay Pocket APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/pocket-workstation-side-tab-20260929]
    paths:
      - 'app/**'
      - 'docs/ecosystem-bindings.json'
      - 'tests/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Pocket source contract
        run: node tests/pocket-workstation-source.test.mjs

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Measure, hash, and identify APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "package_bytes=$BYTES" | tee pocket-package-evidence.txt
          echo "sha256=$SHA" | tee -a pocket-package-evidence.txt
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee -a pocket-package-evidence.txt

      - name: Stage download APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p docs/download
          cp app/build/outputs/apk/debug/app-debug.apk docs/download/LeeWay-Pocket-Agent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-APK
          path: |
            docs/download/LeeWay-Pocket-Agent.apk
            pocket-package-evidence.txt
          if-no-files-found: error

      - name: Publish signed GitHub release and update metadata
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          LEEWAY_ANDROID_KEYSTORE_B64: ${{ secrets.LEEWAY_ANDROID_KEYSTORE_B64 }}
          LEEWAY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LEEWAY_ANDROID_KEYSTORE_PASSWORD }}
          LEEWAY_ANDROID_KEY_ALIAS: ${{ secrets.LEEWAY_ANDROID_KEY_ALIAS }}
          LEEWAY_ANDROID_KEY_PASSWORD: ${{ secrets.LEEWAY_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            LEEWAY_ANDROID_KEYSTORE_B64 \
            LEEWAY_ANDROID_KEYSTORE_PASSWORD \
            LEEWAY_ANDROID_KEY_ALIAS \
            LEEWAY_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required LeeWay Android signing secret: $name"
              exit 72
            fi
          done

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          ZIPALIGN="$SDK_ROOT/build-tools/35.0.0/zipalign"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          KEYSTORE="$RUNNER_TEMP/leeway-android-signing.jks"
          printf '%s' "$LEEWAY_ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          gradle :app:assembleRelease --stacktrace --no-daemon
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$UNSIGNED"
          ALIGNED="$RUNNER_TEMP/LeeWay-Agent-Lee-aligned.apk"
          SIGNED="$RUNNER_TEMP/LeeWay-Agent-Lee.apk"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$LEEWAY_ANDROID_KEY_ALIAS" \
            --ks-pass env:LEEWAY_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:LEEWAY_ANDROID_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          SHA="$(sha256sum "$SIGNED" | awk '{print $1}')"
          BYTES="$(stat -c%s "$SIGNED")"
          CERT="$("$APKSIGNER" verify --print-certs "$SIGNED" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')"
          TAG="agent-lee-v${VERSION_NAME}"
          ASSET="LeeWay-Agent-Lee.apk"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SIGNED#$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$SIGNED#$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LeeWay Agent Lee $VERSION_NAME" \
              --notes "Qualified LeeWay Agent Lee Android release. Automatic retrieval is allowed only after user opt-in; installation still requires explicit user approval."
          fi

          export VERSION_CODE VERSION_NAME SHA BYTES CERT TAG ASSET
          mkdir -p docs/download
          node <<'NODE'
          const fs = require('fs');
          const repo = process.env.GITHUB_REPOSITORY;
          const meta = {
            standard: 'LEEWAY-UPDATE-v1.0',
            productId: 'agent-lee-pocket',
            applicationId: 'industries.leeway.pocket',
            canonicalRepository: repo,
            channel: 'stable',
            versionName: process.env.VERSION_NAME,
            versionCode: Number(process.env.VERSION_CODE),
            sourceCommit: process.env.GITHUB_SHA,
            sourceRunId: process.env.GITHUB_RUN_ID,
            downloadUrl: 'https://github.com/' + repo + '/releases/download/' + process.env.TAG + '/' + process.env.ASSET,
            sha256: process.env.SHA,
            signerSha256: process.env.CERT,
            artifactBytes: Number(process.env.BYTES),
            publishedAt: new Date().toISOString()
          };
          fs.writeFileSync(
            'docs/download/LeeWay-Agent-Lee-latest.json',
            JSON.stringify(meta, null, 2) + '\n'
          );
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/LeeWay-Agent-Lee-latest.json
          git diff --cached --quiet || git commit -m "Publish Agent Lee update metadata [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
