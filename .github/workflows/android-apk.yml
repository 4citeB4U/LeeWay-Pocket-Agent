name: Build LeeWay Pocket APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/pocket-workstation-side-tab-20260929]
    paths:
      - 'app/**'
      - 'docs/ecosystem-bindings.json'
      - 'tests/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Pocket source contract
        run: node tests/pocket-workstation-source.test.mjs

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Measure, hash, and identify APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "package_bytes=$BYTES" | tee pocket-package-evidence.txt
          echo "sha256=$SHA" | tee -a pocket-package-evidence.txt
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee -a pocket-package-evidence.txt

      - name: Stage download APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p docs/download
          cp app/build/outputs/apk/debug/app-debug.apk docs/download/LeeWay-Pocket-Agent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-APK
          path: |
            docs/download/LeeWay-Pocket-Agent.apk
            pocket-package-evidence.txt
          if-no-files-found: error

      - name: Publish thin-client qualification prerelease
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/runtime-fabric-thin-client-20261002'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="pocket-0.3.6-runtime-fabric-live-binding-rc2"
          ASSET="LeeWay-Pocket-Agent-0.3.6-unsigned-ci.apk"
          cp docs/download/LeeWay-Pocket-Agent.apk "$ASSET"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET"               --prerelease               --target "$HEAD_SHA"               --title "Pocket 0.3.6 Runtime Fabric live binding RC2"               --notes "Qualification-only unsigned CI APK. LeeWay signing is applied locally on the authorized phone before install."
          fi

      - name: Publish APK into repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/LeeWay-Pocket-Agent.apk
          git diff --cached --quiet || git commit -m "Publish latest LeeWay Pocket APK"
          git push
