name: Build LeeWay Pocket APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/pocket-workstation-side-tab-20260929
      - leeway-live-update-repair-20261002
    paths:
      - app/**
      - docs/ecosystem-bindings.json
      - tests/**
      - '*.gradle.kts'
      - gradle.properties
      - settings.gradle.kts
      - .github/workflows/android-apk.yml

concurrency:
  group: pocket-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify Pocket source contract
        run: node tests/pocket-workstation-source.test.mjs

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Measure and stage verified Pocket release
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          mkdir -p docs/download
          cp "$APK" docs/download/LeeWay-Pocket-Agent.apk
          BYTES=$(stat -c%s docs/download/LeeWay-Pocket-Agent.apk)
          SHA=$(sha256sum docs/download/LeeWay-Pocket-Agent.apk | awk '{print $1}')
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          printf '%s\n' \
            '{' \
            '  "componentId": "pocket-agent",' \
            '  "packageName": "industries.leeway.pocket",' \
            "  \"versionName\": \"$VERSION_NAME\"," \
            "  \"versionCode\": $VERSION_CODE," \
            "  \"sha256\": \"$SHA\"," \
            "  \"sizeBytes\": $BYTES," \
            '  "downloadUrl": "./LeeWay-Pocket-Agent.apk",' \
            "  \"sourceRunId\": \"$SOURCE_RUN_ID\"," \
            "  \"sourceCommit\": \"$SOURCE_COMMIT\"" \
            '}' > docs/download/LeeWay-Pocket-Agent-latest.json
          echo "package_bytes=$BYTES" > pocket-package-evidence.txt
          echo "sha256=$SHA" >> pocket-package-evidence.txt
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" >> pocket-package-evidence.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-APK
          path: |
            docs/download/LeeWay-Pocket-Agent.apk
            docs/download/LeeWay-Pocket-Agent-latest.json
            pocket-package-evidence.txt
          if-no-files-found: error

      - name: Publish repair candidate
        if: ${{ github.ref == 'refs/heads/leeway-live-update-repair-20261002' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/LeeWay-Pocket-Agent.apk docs/download/LeeWay-Pocket-Agent-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Pocket repair candidate"
            git push origin HEAD:leeway-live-update-repair-20261002
          fi

      - name: Publish verified release
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/LeeWay-Pocket-Agent.apk docs/download/LeeWay-Pocket-Agent-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest verified LeeWay Pocket APK"
            git push
          fi
