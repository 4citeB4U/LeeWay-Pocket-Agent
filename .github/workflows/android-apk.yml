name: Build and Publish LeeWay Pocket APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: leeway-pocket-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Prepare downloadable APK
        run: |
          mkdir -p _site
          cp app/build/outputs/apk/debug/app-debug.apk _site/LeeWay-Pocket-Agent.apk
          cp web/index.html _site/index.html
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-APK
          path: _site/LeeWay-Pocket-Agent.apk
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy download page
        id: deployment
        uses: actions/deploy-pages@v4
