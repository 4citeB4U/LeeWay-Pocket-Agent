name: Build LeeWay Pocket APK (Forgejo)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.forgejo/workflows/android-apk.yml'

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java and Android build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk wget unzip git ca-certificates

      - name: Install Android command line tools
        run: |
          export ANDROID_HOME="$FORGEJO_WORKSPACE/.android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R /tmp/android-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$FORGEJO_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$FORGEJO_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$FORGEJO_PATH"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-8.10.2/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LeeWay-Pocket-Agent.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: LeeWay-Pocket-Agent-APK
          path: dist/LeeWay-Pocket-Agent.apk
          retention-days: 30
